[project]
name = "gewaechshaus"
version = "0.1.0"
description = "Full backend including sensor data client and API to fully automate my greenhouse."
authors = [
    {name = "Jannik Kalkmann"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "aiosqlite (>=0.22.1,<1.0.0)",
    "pydantic (>=2.12.0,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "black (>=25.9.0,<26.0.0)",
    "influxdb-client[async] (>=1.49.0,<2.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "apscheduler (>=3.11.2,<4.0.0)"
]

[tool.poetry.group.hardware.dependencies]
rpi-gpio = "^0.7.1"
rpi-bme280 = "^0.2.4"
w1thermsensor = "^2.3.0"
rplcd = "^1.4.0"
smbus2 = "^0.5.0"

[tool.poetry.group.api.dependencies]
fastapi = "^0.121.2"
uvicorn = "^0.38.0"

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
